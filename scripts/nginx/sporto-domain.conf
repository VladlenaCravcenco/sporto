# Managed by SPORTO domain setup. Nginx 1.24 (Ubuntu 24.04).
map $uri $sporto_domain_robots {
    default "";
    ~^/(admin|api|migration|login|register|account|callback|verify|forgot-password|reset-password)(/|$) "noindex, nofollow";
    ~^/(ro|ru)/(order-request|account|login|register|callback|forgot-password|reset-password)(/|$) "noindex, nofollow";
}

server {
    listen 80;
    listen [::]:80;
    server_name sporto.md www.sporto.md;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sporto-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://www.sporto.md$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sporto.md;
    ssl_certificate /etc/letsencrypt/live/sporto.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sporto.md/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://www.sporto.md$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sporto.md;
    ssl_certificate /etc/letsencrypt/live/sporto.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sporto.md/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SPORTO_TLS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 25m;

    # Defining headers here prevents inheriting staging noindex from the http block.
    # Empty values are omitted; app metadata remains responsible for filtered pages.
    add_header X-Robots-Tag $sporto_domain_robots always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
